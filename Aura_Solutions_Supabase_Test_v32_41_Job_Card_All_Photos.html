<script>
/* Stable operator layout cleanup */
(function(){
 if(!new URLSearchParams(location.search).has('operator_v2'))return;
 function clean(){
  var host=document.getElementById('jobDetail');if(!host)return;
  var panel=document.getElementById('operatorV2Panel');if(panel)panel.style.setProperty('display','none','important');
  Array.from(host.children).forEach(function(n){if(n!==panel)n.style.removeProperty('display');});
  if(host.firstElementChild&&host.firstElementChild.classList.contains('row'))host.firstElementChild.style.setProperty('display','none','important');
  ['detailIssueInfo','detailRevisit'].forEach(function(id){var n=document.getElementById(id);if(n)n.style.setProperty('display','none','important');});
 }
 clean();
 new MutationObserver(clean).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['style']});
 setInterval(clean,500);
})();
</script>
<script>
(function(){document.title='Aura Solutions — Operator Workflow v37';var n=document.querySelector('.brand .muted');if(n)n.textContent='Operator Workflow v37';})();
</script>
