<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<title>Aura Solutions Work System</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18211a;background:#f3f6f3;--line:#dce4dd;--green:#237a45}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.bar{max-width:1200px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:46px;height:46px;object-fit:contain}.brand b{font-size:18px}
nav{display:flex;gap:7px;overflow:auto;padding:0 16px 12px;max-width:1200px;margin:auto}nav button{white-space:nowrap}
main{max-width:1200px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 10px #00000009;margin-bottom:14px}
h1{margin:0 0 4px;font-size:26px}h2{margin:0 0 10px;font-size:19px}h3{margin:0 0 8px}.muted{color:#667268}.stat{font-size:30px;font-weight:750}.pill{display:inline-block;border-radius:99px;background:#edf3ee;padding:5px 9px;font-size:12px;font-weight:700}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--green);color:#fff}.light{background:#edf2ee;color:#172018}.danger{background:#fbeceb;color:#8d2924}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{margin:11px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #ccd7ce;border-radius:10px;padding:11px;background:#fff}.field textarea{min-height:90px;resize:vertical}
.job{cursor:pointer}.job:hover{border-color:#9db5a2}.job-title{font-weight:750;font-size:17px}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.photo-grid img{width:100%;height:110px;object-fit:cover;border-radius:10px}.sig{width:100%;height:180px;border:1px dashed #9ca99e;border-radius:10px;background:#fff;touch-action:none}.notice{padding:10px;border-radius:10px;background:#fff7df;border:1px solid #ead89d}.ok{padding:10px;border-radius:10px;background:#edf7ef;border:1px solid #b8d7be}
@media(min-width:800px){.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
</style>
</head>

<nav><button class="btn light" onclick="showDashboard()">Dashboard</button><button class="btn light" onclick="newJob()">New Job</button></nav></header>
<main id="app"></main>
<script>
const KEY='aura_jobs_v1';
let jobs=JSON.parse(localStorage.getItem(KEY)||'[]');
let seq=Number(localStorage.getItem('aura_seq')||1679);
let current=null;
const save=()=>{localStorage.setItem(KEY,JSON.stringify(jobs));localStorage.setItem('aura_seq',seq)};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function statusPill(s){return '<span class="pill">'+esc(s)+'</span>'}
function showDashboard(){
 current=null;
 const counts={Draft:0,'In Progress':0,Submitted:0,Approved:0,'Sent to Customer':0};
 jobs.forEach(j=>counts[j.status]=(counts[j.status]||0)+1);
 document.getElementById('app').innerHTML=`
 <div class="row"><div><h1>Dashboard</h1><div class="muted">Aura Solutions Group Limited</div></div><button class="btn primary" onclick="newJob()">+ Create job</button></div>
 <div class="grid" style="margin:15px 0">${Object.entries(counts).map(([k,v])=>`<div class="card"><div class="muted">${k}</div><div class="stat">${v}</div></div>`).join('')}</div>
 <div class="card"><div class="row"><h2>Jobs</h2><span class="muted">${jobs.length} total</span></div>
 ${jobs.length?jobs.slice().reverse().map(j=>`<div class="card job" onclick="openJob('${j.id}')"><div class="row"><div><div class="job-title">${esc(j.jobNo)} — ${esc(j.customer)}</div><div class="muted">${esc(j.date)} · ${esc(j.address)}</div></div>${statusPill(j.status)}</div><div class="muted" style="margin-top:7px">${esc(j.operative||'Unassigned')}</div></div>`).join(''):'<div class="muted">No jobs yet. Create the first job to start.</div>'}
 </div>`;
}
function newJob(){
 const job={id:crypto.randomUUID(),jobNo:'ASG-'+(++seq),date:new Date().toISOString().slice(0,10),customer:'',address:'',reference:'',topNotes:'',scope:'',attachments:[],operative:'',status:'Draft',arrival:{notes:'',photos:[]},completion:{notes:'',issues:'',photos:[]},waste:{removed:false,type:'',ewc:'',quantity:'',disposalSite:'',disposalDate:'',transferNote:null,disposalEvidence:null},signatures:{customer:null,operative:null},createdAt:new Date().toISOString()};
 jobs.push(job);save();openJob(job.id);
}
function openJob(id){
 current=jobs.find(j=>j.id===id);
 renderJob();
}
function renderJob(){
 const j=current;
 document.getElementById('app').innerHTML=`
 <div class="row"><div><h1>${esc(j.jobNo)}</h1><div class="muted">${esc(j.customer||'New customer')} · ${esc(j.date)}</div></div><div class="actions"><button class="btn light" onclick="showDashboard()">Back</button><button class="btn primary" onclick="printReport()">Print / PDF</button></div></div>
 <div class="two">
 <section class="card"><h2>Job details</h2>
 ${input('Customer name','customer',j.customer)}${input('Site address','address',j.address)}${input('Job reference','reference',j.reference)}${input('Job date','date',j.date,'date')}${input('Operative','operative',j.operative)}
 ${textarea('Notes','topNotes',j.topNotes)}
 <div class="field"><label>Status</label><select onchange="setVal('status',this.value)">${['Draft','Sent','In Progress','Submitted','Needs Correction','Approved','Sent to Customer','Archived'].map(x=>`<option ${j.status===x?'selected':''}>${x}</option>`).join('')}</select></div>
 </section>
 <section class="card"><h2>Scope of works</h2>${textarea('Scope of works','scope',j.scope)}<div class="notice">Attachments will become secure cloud uploads in the production version. Use the sections below for site evidence now.</div></section>
 </div>
 <section class="card"><h2>Arrival</h2>${textarea('Arrival / access / site condition notes','arrival.notes',j.arrival.notes)}${photoInput('arrival')}${photos('arrival',j.arrival.photos)}</section>
 <section class="card"><h2>Completion</h2>${textarea('Work completed','completion.notes',j.completion.notes)}${textarea('Issues encountered','completion.issues',j.completion.issues)}${photoInput('completion')}${photos('completion',j.completion.photos)}</section>
 <section class="card"><h2>Waste</h2><div class="field"><label>Was waste removed?</label><select onchange="setWaste(this.value==='Yes')"><option ${!j.waste.removed?'selected':''}>No</option><option ${j.waste.removed?'selected':''}>Yes</option></select></div>
 ${j.waste.removed?`
 <div class="two">${input('Waste type','waste.type',j.waste.type)}${input('EWC code','waste.ewc',j.waste.ewc)}${input('Quantity / weight','waste.quantity',j.waste.quantity)}${input('Disposal site','waste.disposalSite',j.waste.disposalSite)}${input('Disposal date','waste.disposalDate',j.waste.disposalDate,'date')}</div>
 <div class="field"><label>Waste Transfer Note</label><input type="file" accept="image/*,.pdf" onchange="fileEvidence(this,'transferNote')"></div>

 <section class="card"><div class="row"><div><h2>Submit job</h2><div class="muted">Mandatory evidence is checked before submission.</div></div><button class="btn primary" onclick="submitJob()">Submit Job</button></div><div id="submitMsg"></div></section>`;
}
function input(label,path,value,type='text'){return `<div class="field"><label>${label}</label><input type="${type}" value="${esc(value)}" oninput="setPath('${path}',this.value)"></div>`}
function textarea(label,path,value){return `<div class="field"><label>${label}</label><textarea oninput="setPath('${path}',this.value)">${esc(value)}</textarea></div>`}
function setVal(k,v){current[k]=v;save()}
function setPath(path,v){let a=path.split('.'),o=current;for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v;save()}
function photoInput(section){return `<div class="field"><label>Mandatory ${section} photos</label><input type="file" accept="image/*" capture="environment" multiple onchange="addPhotos(this,'${section}')"></div>`}
function addPhotos(el,section){[...el.files].forEach(f=>{const r=new FileReader();r.onload=()=>{current[section].photos.push(r.result);save();renderJob()};r.readAsDataURL(f)});el.value=''}
function photos(section,arr){return `<div class="photo-grid">${arr.map((p,i)=>`<div><img src="${p}"><button class="btn danger" style="width:100%;margin-top:4px" onclick="removePhoto('${section}',${i})">Remove</button></div>`).join('')}</div>`}
function removePhoto(s,i){current[s].photos.splice(i,1);save();renderJob()}
function setWaste(v){current.waste.removed=v;save();renderJob()}
function fileEvidence(el,key){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{current.waste[key]={name:f.name,data:r.result};save();renderJob()};r.readAsDataURL(f)}
function wasteValid(){const w=current.waste;return !w.removed||!!(w.type&&w.ewc&&w.quantity&&w.disposalSite&&w.disposalDate&&w.transferNote&&w.disposalEvidence)}
function sigCanvas(who){return `<canvas id="sig-${who}" class="sig"></canvas><div class="actions" style="margin-top:6px"><button class="btn light" onclick="clearSig('${who}')">Clear</button><button class="btn light" onclick="saveSig('${who}')">Save signature</button></div>`}
function setupSigs(){['customer','operative'].forEach(w=>{const c=document.getElementById('sig-'+w);if(!c)return;const ctx=c.getContext('2d');let down=false,last=null;const pos=e=>{const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}};const start=e=>{e.preventDefault();down=true;last=pos(e)};const move=e=>{if(!down)return;e.preventDefault();const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};const end=()=>down=false;c.width=c.clientWidth*2;c.height=c.clientHeight*2;ctx.lineWidth=3;ctx.lineCap='round';c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);c.addEventListener('pointerup',end);c.addEventListener('pointerleave',end)})}
function saveSig(w){const c=document.getElementById('sig-'+w);if(!c)return;current.signatures[w]={data:c.toDataURL('image/png'),timestamp:new Date().toISOString()};save();alert('Signature saved');renderJob()}
function clearSig(w){const c=document.getElementById('sig-'+w);if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}
function submitJob(){const missing=[];if(!current.customer)missing.push('customer name');if(!current.address)missing.push('address');if(!current.operative)missing.push('operative');if(!current.arrival.notes)missing.push('arrival notes');if(!current.arrival.photos.length)missing.push('arrival photos');if(!current.completion.notes)missing.push('completion notes');if(!current.completion.photos.length)missing.push('completion photos');if(!current.signatures.customer)missing.push('customer signature');if(!current.signatures.operative)missing.push('operative signature');if(!wasteValid())missing.push('waste evidence/details');const box=document.getElementById('submitMsg');if(missing.length){box.innerHTML='<div class="notice">Cannot submit yet: '+missing.join(', ')+'.</div>';return}current.status='Submitted';current.submittedAt=new Date().toISOString();save();renderJob();alert('Job submitted. In the production system this will sync to the server and appear in the office review queue.')}
function printReport(){
 const j=current;
 const w=j.waste||{};
 const logo=(document.querySelector('.brand img')||{}).src||'';
 const escAttr=v=>esc(v).replace(/`/g,'&#96;');
 const nl=v=>esc(v||'').replace(/\n/g,'<br>');
 const photoBlock=(arr,caption)=>{
   if(!arr||!arr.length)return '';
   return `<div class="photo-section"><div class="photo-caption">${caption}</div><div class="photos">${arr.map((x,i)=>`<figure><img src="${x}" alt="${caption} ${i+1}"><figcaption>${caption} ${i+1}</figcaption></figure>`).join('')}</div></div>`;
 };
 const evidenceImage=(item,label)=>{
   if(!item||!item.data||!String(item.data).startsWith('data:image'))return '';
   return `<div class="evidence"><div class="label">${esc(label)}</div><img src="${item.data}" alt="${esc(label)}"></div>`;
 };
 const signature=(sig,label)=>{
   if(!sig||!sig.data)return '';
   return `<div class="signature"><div class="label">${esc(label)}</div><img src="${sig.data}" alt="${esc(label)} signature"><div class="sig-line"></div></div>`;
 };
 const html=`<!doctype html>

<body>
